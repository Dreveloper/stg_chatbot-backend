cat > nixpacks.toml << 'EOF'
[phases.install]
cmds = ["pip install fastapi uvicorn groq langchain langchain-community langchain-huggingface chromadb sentence-transformers python-multipart"]

[start]
cmd = "python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
EOF

git add nixpacks.toml
git commit -m "fix nixpacks install"
git push origin main --force
